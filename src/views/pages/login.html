<div class="container auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <p class="eyebrow">{{t:nav.account}}</p>
    <h1 class="auth-card__title display" id="login-title">{{t:auth.loginTitle}}</h1>
    <p class="auth-card__lead">{{t:auth.loginLead}}</p>
    <form class="stack" data-login-form data-surface="site" novalidate>
      <div class="field">
        <label class="field__label" for="login-email">{{t:auth.email}}</label>
        <input class="control control--lg" id="login-email" name="email" type="email" autocomplete="username" inputmode="email" required maxlength="254">
      </div>
      <div class="field">
        <label class="field__label" for="login-password">{{t:auth.password}}</label>
        <div class="password-input">
          <input class="control control--lg" id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="128">
          <button class="password-input__toggle" type="button" data-password-toggle aria-pressed="false" aria-controls="login-password" data-label-show="{{t:auth.showPassword}}" data-label-hide="{{t:auth.hidePassword}}">
            <svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg><span class="visually-hidden">{{t:auth.showPassword}}</span>
          </button>
        </div>
      </div>
      <p class="form-error" role="alert" data-form-error hidden></p>
      <button class="btn btn-accent btn-lg btn-block" type="submit" data-busy-label="{{t:auth.loggingIn}}">{{t:auth.loginButton}}</button>
    </form>
    <p class="auth-card__alt">{{t:auth.noAccount}} <a href="/register">{{t:nav.register}}</a></p>
    <p class="muted small">{{t:auth.forgotPassword}} <a href="{{v:supportPhoneHref}}">{{v:supportPhone}}</a></p>
    <p class="muted small"><a href="/admin/login">{{t:auth.staffHint}}</a></p>
  </section>
  <aside class="auth-aside blueprint" aria-hidden="true">
    <ul class="auth-benefits">
      <li><svg class="icon"><use href="#i-history"></use></svg>{{t:account.myQuotes}}</li>
      <li><svg class="icon"><use href="#i-clipboard"></use></svg>{{t:home.step2Text}}</li>
      <li><svg class="icon"><use href="#i-shield"></use></svg>{{t:auth.adminSecurityNote}}</li>
    </ul>
  </aside>
</div>
