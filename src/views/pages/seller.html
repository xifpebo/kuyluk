<div class="admin admin--seller" data-admin>
  <aside class="admin-sidebar" id="admin-sidebar" data-sidebar aria-label="{{t:admin.nav.label}}">
    <div class="admin-sidebar__brand">
      <a class="brand" href="/seller#/dashboard">
        <svg class="brand__mark" aria-hidden="true"><use href="#i-logo"></use></svg>
        <span class="brand__text"><span class="brand__name">Stroy<span class="brand__name-accent">Bazar</span></span></span>
      </a>
      <span class="admin-sidebar__tag">{{t:seller.brand}}</span>
      <button class="btn btn-icon btn-ghost admin-sidebar__close" type="button" data-sidebar-close>
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg><span class="visually-hidden">{{t:nav.closeMenu}}</span>
      </button>
    </div>

    <nav class="admin-nav">
      <a class="admin-nav__link" href="#/dashboard" data-route="dashboard">
        <svg class="icon" aria-hidden="true"><use href="#i-dashboard"></use></svg>{{t:seller.nav.dashboard}}
      </a>
      <a class="admin-nav__link" href="#/products" data-route="products">
        <svg class="icon" aria-hidden="true"><use href="#i-package"></use></svg>{{t:seller.nav.products}}
        <span class="admin-nav__badge admin-nav__badge--muted" data-pending-badge hidden></span>
      </a>
      <a class="admin-nav__link" href="#/products/new" data-route="product-new">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>{{t:admin.products.new}}
      </a>
      <a class="admin-nav__link" href="#/shop" data-route="shop">
        <svg class="icon" aria-hidden="true"><use href="#i-store"></use></svg>{{t:seller.nav.shop}}
      </a>
      <p class="admin-nav__group">{{t:seller.nav.helpGroup}}</p>
      <a class="admin-nav__link" href="/sell" target="_blank" rel="noopener">
        <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>{{t:seller.nav.rules}}
      </a>
      <a class="admin-nav__link" href="/contact" target="_blank" rel="noopener">
        <svg class="icon" aria-hidden="true"><use href="#i-chat"></use></svg>{{t:seller.nav.support}}
      </a>
    </nav>

    <div class="admin-sidebar__foot">
      <a class="admin-user" href="#/profile" data-route="profile">
        <span class="admin-user__avatar" data-user-initials aria-hidden="true"></span>
        <span class="admin-user__meta">
          <span class="admin-user__name" data-user-name></span>
          <span class="admin-user__role" data-user-role></span>
        </span>
      </a>
      <button class="btn btn-ghost btn-sm btn-block" type="button" data-logout>
        <svg class="icon" aria-hidden="true"><use href="#i-logout"></use></svg>{{t:nav.logout}}
      </button>
    </div>
  </aside>
  <div class="admin-backdrop" data-sidebar-close hidden></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="btn btn-icon btn-ghost admin-topbar__menu" type="button" data-sidebar-open aria-controls="admin-sidebar" aria-expanded="false">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg><span class="visually-hidden">{{t:nav.openMenu}}</span>
      </button>
      <p class="admin-topbar__title" data-view-title>{{t:seller.metaTitle}}</p>
      <div class="admin-topbar__actions">
        {{> lang-switch}}
        <a class="btn btn-ghost btn-sm admin-topbar__site" href="/" target="_blank" rel="noopener">
          <span>{{t:admin.nav.viewSite}}</span><svg class="icon" aria-hidden="true"><use href="#i-external"></use></svg>
        </a>
      </div>
    </header>
    <main class="admin-content" id="admin-main" tabindex="-1" data-view>
      <div class="admin-loading"><span class="spinner" aria-hidden="true"></span>{{t:common.loading}}</div>
    </main>
  </div>
</div>
