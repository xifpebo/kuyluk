<section class="error-page blueprint">
  <div class="container error-page__inner">
    <p class="error-page__code display" aria-hidden="true">{{t:notFound.code}}</p>
    <div class="hazard-tape" aria-hidden="true"></div>
    <h1 class="error-page__title display">{{t:notFound.title}}</h1>
    <p class="error-page__text">{{t:notFound.text}}</p>
    <div class="button-row">
      <a class="btn btn-accent btn-lg" href="/">{{t:notFound.home}}</a>
      <a class="btn btn-ghost btn-lg" href="/catalog">{{t:notFound.catalog}}</a>
    </div>
  </div>
</section>
