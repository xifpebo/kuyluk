<div class="page-head blueprint">
  <div class="container">
    <nav class="breadcrumbs" aria-label="{{t:common.breadcrumb}}">
      <ol>
        <li><a href="/">{{t:common.home}}</a></li>
        <li aria-current="page">{{t:nav.suppliers}}</li>
      </ol>
    </nav>
    <h1 class="page-title display">{{t:suppliers.title}}</h1>
    <p class="page-lead">{{t:suppliers.lead}}</p>
    <form class="inline-search" role="search" data-supplier-search>
      <label class="visually-hidden" for="supplier-q">{{t:suppliers.searchLabel}}</label>
      <div class="input-icon">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input class="control control--lg" id="supplier-q" name="q" type="search" maxlength="60" autocomplete="off" placeholder="{{t:suppliers.searchPlaceholder}}">
      </div>
      <button class="btn btn-accent btn-lg" type="submit">{{t:common.search}}</button>
    </form>
  </div>
</div>

<div class="container section section--tight">
  <p class="catalog__count" aria-live="polite" data-supplier-count></p>
  <div class="supplier-grid" data-supplier-grid aria-busy="true"></div>
  <nav class="pagination" data-pagination aria-label="{{t:catalog.pagination}}" hidden></nav>
</div>
