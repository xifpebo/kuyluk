# Render Blueprint (https://render.com/docs/blueprint-spec).
# Values marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: stroy-bazar
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Random 256-bit secret generated by Render.
      - key: APP_SECRET
        generateValue: true
      # MongoDB connection string, e.g. from MongoDB Atlas (mongodb+srv://…).
      - key: MONGODB_URI
        sync: false
      # Your public address with https://, e.g. https://stroybazar.uz.
      # Leave empty to use the *.onrender.com address.
      - key: APP_ORIGIN
        sync: false
      # First super-admin. Remove ADMIN_PASSWORD after the first sign-in.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Load the demo shops and products into an empty database.
      - key: SEED_DEMO_DATA
        value: "true"
